<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Kart & Küçük Video Konfigürasyonu */
    .video-card {
      position: relative;
      width: 100%;
      max-width: 800px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      background: #000;
      cursor: pointer;
    }

    .preview-video {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* Overlay Buton */
    .overlay-btn {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      backdrop-filter: blur(4px);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .video-card:hover .overlay-btn {
      background: rgba(0, 0, 0, 0.9);
      border-color: #fff;
    }

    /* Lightbox (Ekranı Kaplayan Tam Ekran Katmanı) */
    .lightbox-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.95);
      z-index: 999999;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(8px);
    }

    .lightbox-modal.active {
      display: flex;
    }

    .lightbox-video {
      max-width: 95vw;
      max-height: 90vh;
      border-radius: 8px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.8);
      outline: none;
    }

    /* Kapat (X) Butonu */
    .close-btn {
      position: absolute;
      top: 20px;
      right: 25px;
      color: #ffffff;
      font-size: 36px;
      font-weight: 300;
      cursor: pointer;
      line-height: 1;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      transition: background 0.2s ease;
      user-select: none;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>

  <!-- Sayfa Üzerindeki Normal Video Kartı -->
  <div class="video-card" onclick="openLightbox()">
    <video class="preview-video" muted autoplay loop playsinline>
      <source src="https://github.com/erdoganalpdogan-art/portfolio-assets/releases/download/Product/Lancaster.mp4" type="video/mp4">
      Tarayıcınız video etiketini desteklemiyor.
    </video>
    <button class="overlay-btn" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
      Tam Ekran İzle
    </button>
  </div>

  <!-- Tıklandığında Açılan Tam Ekran Modal (Lightbox) -->
  <div class="lightbox-modal" id="videoModal" onclick="closeLightboxOnBg(event)">
    <span class="close-btn" onclick="closeLightbox()">&times;</span>
    <video class="lightbox-video" id="modalVideo" controls>
      <source src="https://github.com/erdoganalpdogan-art/portfolio-assets/releases/download/Product/Lancaster.mp4" type="video/mp4">
    </video>
  </div>

  <script>
    const modal = document.getElementById('videoModal');
    const modalVideo = document.getElementById('modalVideo');

    function openLightbox() {
      modal.classList.add('active');
      modalVideo.currentTime = 0;
      modalVideo.play();
    }

    function closeLightbox() {
      modal.classList.remove('active');
      modalVideo.pause();
    }

    function closeLightboxOnBg(event) {
      if (event.target === modal) {
        closeLightbox();
      }
    }

    // ESC tuşuna basıldığında kapat
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape' && modal.classList.contains('active')) {
        closeLightbox();
      }
    });
  </script>
</body>
</html>
