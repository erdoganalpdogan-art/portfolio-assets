<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .player-container {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      background: #000;
    }

    /* YouTube marka öğelerini ve üst bilgileri ekran dışına taşıma */
    .plyr__video-embed iframe {
      transform: scale(1.18);
    }

    /* Modern Şeffaf / Beyaz Tema */
    :root {
      --plyr-color-main: #ffffff;
      --plyr-video-control-color: #ffffff;
      --plyr-video-control-background-hover: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <div class="player-container">
    <div class="plyr__video-embed" id="player">
      <iframe
        src="https://www.youtube-nocookie.com/embed/hu9oooL8Uuc?origin=https://plyr.io&amp;iv_load_policy=3&amp;modestbranding=1&amp;playsinline=1&amp;showinfo=0&amp;rel=0&amp;enablejsapi=1"
        allowfullscreen
        allow="autoplay"
      ></iframe>
    </div>
  </div>

  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
  <script>
    const player = new Plyr('#player', {
      controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
      youtube: { 
        noCookie: true, 
        rel: 0, 
        showinfo: 0, 
        iv_load_policy: 3,
        modestbranding: 1
      }
    });
  </script>
</body>
</html>
